name: Build & Release Apps

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  release:
    types:
      - published
      - created
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish assets to a GitHub Release'
        type: boolean
        default: false
      release_tag:
        description: 'Release tag (required if publishing via manual dispatch and not on a tag, e.g. v1.0.1)'
        type: string
        default: ''
      prerelease:
        description: 'Mark release as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS 27 (.pkg)
    runs-on: xcode-27
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display Xcode & SDK info
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Run Apple logic tests
        run: |
          for suite in AppleCoreLogicTests AppleSyncLogicTests; do
            swiftc -D CLASSROOM_TESTING "Tests/$suite.swift" Shared/Models/*.swift \
              Shared/Storage/*.swift Shared/PlatformUICompat.swift Shared/WidgetViews/*.swift \
              Shared/Network/*.swift -o "$RUNNER_TEMP/$suite"
            "$RUNNER_TEMP/$suite"
          done

      - name: Build macOS 27 app & package PKG
        env:
          OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          chmod +x scripts/build_pkg.sh
          ./scripts/build_pkg.sh

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassroomTracker-macOS-pkg
          path: ClassroomTracker.pkg
          retention-days: 14

  build-ios:
    name: Build iOS (17 -> 27) (.ipa)
    runs-on: xcode-27
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display Xcode & SDK info
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Archive iOS app & package IPA
        env:
          OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          chmod +x scripts/build_ipa.sh
          ./scripts/build_ipa.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassroomTracker-iOS-ipa
          path: ClassroomTracker.ipa
          retention-days: 14

  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew and scripts executable
        run: |
          chmod +x android/gradlew
          chmod +x scripts/build_apk.sh

      - name: Configure APK signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PUBLISH_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.create_release) }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            : "${KEYSTORE_PASSWORD:?Missing Android keystore password}"
            : "${KEY_ALIAS:?Missing Android key alias}"
            : "${KEY_PASSWORD:?Missing Android key password}"
            echo "Release keystore detected from secrets, decoding..."
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/android/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          elif [ "$PUBLISH_RELEASE" = true ]; then
            echo "::error::Configure the existing Android release keystore before publishing an upgrade."
            exit 1
          else
            echo "Generating a temporary keystore for CI testing..."
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/android/debug.keystore" \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/android/debug.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Run Android Unit Tests
        run: |
          cd android
          ./gradlew testReleaseUnitTest

      - name: Build Android Release APK
        env:
          OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: ./scripts/build_apk.sh

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassroomTracker-Android-apk
          path: ClassroomTracker.apk
          retention-days: 14

  publish-release:
    name: Publish Release Assets
    needs: [build-macos, build-ios, build-android]
    runs-on: ubuntu-latest
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download macOS PKG
        uses: actions/download-artifact@v4
        with:
          name: ClassroomTracker-macOS-pkg
          path: dist

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ClassroomTracker-iOS-ipa
          path: dist

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: ClassroomTracker-Android-apk
          path: dist

      - name: Verify downloaded assets
        run: |
          echo "Release assets ready for publication:"
          ls -lh dist/

      - name: Determine Release Tag
        id: tag_info
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          REQUESTED_PRERELEASE: ${{ inputs.prerelease || github.event.release.prerelease || false }}
        run: |
          if [ -n "$REQUESTED_TAG" ]; then
            tag="$REQUESTED_TAG"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="v$(date +'%Y.%m.%d-%H%M')"
          fi
          git check-ref-format "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          prerelease="$REQUESTED_PRERELEASE"
          if [[ "$tag" == v0.5.0 || "$tag" =~ -(alpha|beta|rc|preview) ]]; then
            prerelease=true
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Publish Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/ClassroomTracker.pkg
            dist/ClassroomTracker.ipa
            dist/ClassroomTracker.apk
          draft: false
          prerelease: ${{ steps.tag_info.outputs.prerelease == 'true' }}
          body_path: ${{ steps.tag_info.outputs.tag == 'v0.5.0' && 'docs/releases/v0.5.0.md' || '' }}
          generate_release_notes: true

