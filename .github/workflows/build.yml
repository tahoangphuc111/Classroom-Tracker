name: Build & Release Apps

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  release:
    types:
      - published
      - created
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish assets to a GitHub Release'
        type: boolean
        default: false
      release_tag:
        description: 'Release tag (required if publishing via manual dispatch and not on a tag, e.g. v1.0.1)'
        type: string
        default: ''
      prerelease:
        description: 'Mark release as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS 27 (.pkg)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display Xcode & SDK info
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build macOS 27 app & package PKG
        run: |
          chmod +x scripts/build_pkg.sh
          ./scripts/build_pkg.sh

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassroomTracker-macOS-pkg
          path: ClassroomTracker.pkg
          retention-days: 14

  build-ios:
    name: Build iOS (17 -> 27) (.ipa)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display Xcode & SDK info
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Archive iOS app & package IPA
        run: |
          chmod +x scripts/build_ipa.sh
          ./scripts/build_ipa.sh

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassroomTracker-iOS-ipa
          path: ClassroomTracker.ipa
          retention-days: 14

  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make gradlew and scripts executable
        run: |
          chmod +x android/gradlew
          chmod +x scripts/build_apk.sh

      - name: Configure Keystore (Optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Release keystore detected from secrets, decoding..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/android/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "No custom keystore provided. Building with self-signed signature for testing/distribution."
          fi

      - name: Run Android Unit Tests
        run: |
          cd android
          ./gradlew testReleaseUnitTest

      - name: Build Android Release APK
        run: ./scripts/build_apk.sh

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassroomTracker-Android-apk
          path: ClassroomTracker.apk
          retention-days: 14

  publish-release:
    name: Publish Release Assets
    needs: [build-macos, build-ios, build-android]
    runs-on: ubuntu-latest
    if: >
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download macOS PKG
        uses: actions/download-artifact@v4
        with:
          name: ClassroomTracker-macOS-pkg
          path: dist

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ClassroomTracker-iOS-ipa
          path: dist

      - name: Verify downloaded assets
        run: |
          echo "Release assets ready for publication:"
          ls -lh dist/

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
          fi

      - name: Publish Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          files: |
            dist/ClassroomTracker.pkg
            dist/ClassroomTracker.ipa
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
