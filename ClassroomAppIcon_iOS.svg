<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ios6SkyBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ED6FF"/>
      <stop offset="28%" stop-color="#3BB8FF"/>
      <stop offset="68%" stop-color="#1594F7"/>
      <stop offset="100%" stop-color="#0265CD"/>
    </linearGradient>

    <linearGradient id="ios6GlossArc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.78"/>
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.52"/>
      <stop offset="65%" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="98%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>

    <radialGradient id="topSunlightFlare" cx="50%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.00"/>
    </radialGradient>

    <radialGradient id="topLeftHotspot" cx="28%" cy="14%" r="35%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.60"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.00"/>
    </radialGradient>

    <linearGradient id="topBevelRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="2%" stop-color="#FFFFFF" stop-opacity="0.50"/>
      <stop offset="6%" stop-color="#FFFFFF" stop-opacity="0.00"/>
    </linearGradient>

    <radialGradient id="bottomInternalBounce" cx="50%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#9DEBFF" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#72DBFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#72DBFF" stop-opacity="0.00"/>
    </radialGradient>

    <linearGradient id="bottomBevelRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.00"/>
      <stop offset="92%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.55"/>
    </linearGradient>

    <radialGradient id="broadAmbientShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#031432" stop-opacity="0.45"/>
      <stop offset="28%" stop-color="#041638" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#061C48" stop-opacity="0.18"/>
      <stop offset="78%" stop-color="#0A245C" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0E2C6C" stop-opacity="0.00"/>
    </radialGradient>

    <radialGradient id="mediumCastShadow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#010C22" stop-opacity="0.65"/>
      <stop offset="32%" stop-color="#02102E" stop-opacity="0.45"/>
      <stop offset="64%" stop-color="#03163E" stop-opacity="0.22"/>
      <stop offset="85%" stop-color="#062054" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0A2864" stop-opacity="0.00"/>
    </radialGradient>

    <radialGradient id="tightContactShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#010512" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#01081C" stop-opacity="0.62"/>
      <stop offset="72%" stop-color="#020E28" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#041438" stop-opacity="0.00"/>
    </radialGradient>

    <linearGradient id="boardTopSurface" x1="0.1" y1="0.05" x2="0.9" y2="0.95">
      <stop offset="0%" stop-color="#363E50"/>
      <stop offset="22%" stop-color="#2A3141"/>
      <stop offset="60%" stop-color="#1C212D"/>
      <stop offset="100%" stop-color="#12161F"/>
    </linearGradient>

    <linearGradient id="boardEdgeLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2D3546"/>
      <stop offset="100%" stop-color="#1E232E"/>
    </linearGradient>

    <linearGradient id="boardEdgeRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#151922"/>
      <stop offset="100%" stop-color="#0D1016"/>
    </linearGradient>

    <linearGradient id="skullCapCloth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#161B25"/>
      <stop offset="18%" stop-color="#262F3E"/>
      <stop offset="46%" stop-color="#384357"/>
      <stop offset="78%" stop-color="#1F2633"/>
      <stop offset="100%" stop-color="#11151D"/>
    </linearGradient>

    <linearGradient id="skullCapOcclusion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#040609" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#090C12" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#090C12" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="goldDomeGrad" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="25%" stop-color="#F59E0B"/>
      <stop offset="65%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <linearGradient id="goldCordGrad" x1="0.1" y1="0.2" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="25%" stop-color="#F59E0B"/>
      <stop offset="65%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <linearGradient id="goldFringeBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="18%" stop-color="#D97706"/>
      <stop offset="45%" stop-color="#FDE047"/>
      <stop offset="75%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <linearGradient id="fabricButtonGrad" x1="0.2" y1="0.1" x2="0.8" y2="0.9">
      <stop offset="0%" stop-color="#424B5D"/>
      <stop offset="40%" stop-color="#262D3B"/>
      <stop offset="100%" stop-color="#141820"/>
    </linearGradient>
