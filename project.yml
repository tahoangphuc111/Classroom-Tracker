name: ClassroomTracker
options:
  bundleIdPrefix: com.phucta
  deploymentTarget:
    macOS: "27.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  ClassroomApp:
    type: application
    platform: macOS
    sources:
      - path: ClassroomApp
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: "Classroom Tracker"
        PRODUCT_BUNDLE_IDENTIFIER: com.phucta.ClassroomTracker
        INFOPLIST_FILE: ClassroomApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: ClassroomApp/ClassroomApp.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
    dependencies:
      - target: ClassroomWidget

  ClassroomWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: ClassroomWidget
      - path: Shared/Models
      - path: Shared/Storage
      - path: Shared/WidgetViews
    settings:
      base:
        PRODUCT_NAME: "Classroom Deadlines"
        PRODUCT_BUNDLE_IDENTIFIER: com.phucta.ClassroomTracker.widget
        INFOPLIST_FILE: ClassroomWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: ClassroomWidget/ClassroomWidget.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
